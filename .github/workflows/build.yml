name: Build App

on:
  workflow_dispatch:
  pull_request:

# The enabled SSO providers are a build-time flag: ssoProviders= in gradle.properties
# (read into BuildConfig.SSO_ENABLED_PROVIDERS in app/build.gradle.kts). This matrix
# builds both variants with whatever value that property has — keep it as the baseline
# of providers proven to work in the in-app WebView (currently Office 365 only).

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ debug, release ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Use the MIT-licensed cache implementation; the default "enhanced"
          # provider is backed by a proprietary library.
          cache-provider: basic
          # Pull requests and the debug matrix job only read the cache. The release
          # job writes the shared basic-cache entry so the two jobs don't race.
          cache-read-only: ${{ github.event_name == 'pull_request' || matrix.variant == 'debug' }}

      - name: Verify FOSS dependency tree
        shell: bash
        run: ./scripts/check-foss.sh

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_RELEASE_PASSWORD: ${{ secrets.KEY_RELEASE_PASSWORD }}
          KEY_DEBUG_PASSWORD: ${{ secrets.KEY_DEBUG_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/UntisPlus.jks
          printf 'keystorePassword=%s\nkeyReleasePassword=%s\nkeyDebugPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_RELEASE_PASSWORD" "$KEY_DEBUG_PASSWORD" > app/signing.properties

      - name: Assemble debug APK
        if: ${{ matrix.variant == 'debug' }}
        run: ./gradlew assembleDebug --parallel --console=plain

      - name: Assemble release APK
        if: ${{ matrix.variant == 'release' }}
        run: ./gradlew assembleRelease --parallel --console=plain

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v7
        with:
          name: untisplus-${{ matrix.variant }}
          path: |
            app/build/outputs/apk/${{ matrix.variant }}/*.apk
            app/build/outputs/apk/${{ matrix.variant }}/output-metadata.json
